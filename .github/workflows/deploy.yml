name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: reviewforge-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deploy bundle
        run: git bundle create "reviewforge-${GITHUB_SHA}.bundle" main

      - name: Upload deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: reviewforge-${{ github.sha }}.bundle
          target: /tmp
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/reviewforge
            BUNDLE_PATH="/tmp/reviewforge-${{ github.sha }}.bundle"
            git fetch "$BUNDLE_PATH" main
            git reset --hard FETCH_HEAD
            # Allow HTTP / private-network LLM endpoints (self-hosted model
            # gateway).  .env is gitignored and preserved across deploys, so the
            # deploy step keeps this flag pinned instead of requiring a manual
            # server edit.  Set the value to 0 to re-enable the SSRF guard.
            touch .env
            if grep -q '^REVIEWFORGE_ALLOW_PRIVATE_LLM_ENDPOINTS=' .env; then
              sed -i 's|^REVIEWFORGE_ALLOW_PRIVATE_LLM_ENDPOINTS=.*|REVIEWFORGE_ALLOW_PRIVATE_LLM_ENDPOINTS=1|' .env
            else
              printf 'REVIEWFORGE_ALLOW_PRIVATE_LLM_ENDPOINTS=1\n' >> .env
            fi
            REVIEWFORGE_BUNDLE_PATH="$BUNDLE_PATH" bash scripts/deploy.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: cd backend && uv sync --frozen && uv run ruff check . && uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Sync test environment
        run: cd backend && uv sync --frozen
      - name: Run tests with one stall retry
        shell: bash
        run: |
          cd backend
          run_tests() {
            timeout --signal=TERM --kill-after=15s 180 \
              uv run --no-sync pytest -q
          }
          run_tests || {
            status=$?
            if [[ "$status" -ne 124 && "$status" -ne 137 && "$status" -ne 143 ]]; then
              exit "$status"
            fi
            echo "::warning::Test runner stalled; retrying once in a fresh process"
            run_tests
          }
